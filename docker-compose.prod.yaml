services:
  front_prod:
    container_name: ${PROJECT_NAME}_prod_front
    build:
      context: ./front
      dockerfile: Dockerfile.prod # utilisez ce Dockerfile prod multi-stage
      args:
        URL_BACK: ${URL_BACK_PROD}
    environment:
      - URL_BACK=${URL_BACK_PROD}
    ports:
      - "${FRONT_PORT_PROD}:80" # Expose Nginx port 80 sur ${FRONT_PORT_PROD}
    volumes: [] # Pas de montage du dossier source, les fichiers statiques sont dans l'image

  back_prod:
    container_name: ${PROJECT_NAME}_prod_back
    build:
      context: ./back
      dockerfile: Dockerfile
    volumes:
      - ./datas:/app/datas
      - ./back:/var/www/html
      - vendor_data:/var/www/html/vendor
    ports:
      - "${BACK_PORT_PROD}:8000"
    restart: always
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL_PROD}
      APP_SECRET: ${APP_SECRET}
      weatherApiKey: ${weatherApiKey}
      weatherApiFreeVersion: ${weatherApiFreeVersion}
      savKey: ${savKey}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    depends_on:
      - db_prod
      - php-fpm_prod

  php-fpm_prod:
    container_name: ${PROJECT_NAME}_prod_phpfpm
    build:
      context: ./php-fpm
    volumes:
      - ./back:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL_PROD}
      APP_SECRET: ${APP_SECRET}
      weatherApiKey: ${weatherApiKey}
      weatherApiFreeVersion: ${weatherApiFreeVersion}
      savKey: ${savKey}
    depends_on:
      - db_prod
    networks:
      default:
        aliases:
          - php-fpm

  db_prod:
    container_name: ${PROJECT_NAME}_prod_db
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT_PROD}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin_prod:
    container_name: ${PROJECT_NAME}_prod_phpmyadmin
    image: phpmyadmin/phpmyadmin:5.2.1
    restart: always
    environment:
      PMA_HOST: db_prod
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT_PROD}:80"
    depends_on:
      - db_prod

  nginx_prod:
    container_name: ${PROJECT_NAME}_prod_nginx
    image: nginx:latest
    ports:
      - "${NGINX_PORT_PROD}:80"
    volumes:
      - ./back:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm_prod
  
  backup:
    container_name: ${PROJECT_NAME}_prod_backup
    image: fradelg/mysql-cron-backup
    restart: always
    environment:
      - MYSQL_HOST=db_prod
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DATABASE}
      - CRON_TIME=0 3 * * *       # Sauvegarde tous les jours à 03h00
      - MAX_BACKUPS=7             # Conserve les 7 derniers backups
      - GZIP_LEVEL=6
    volumes:
      - ./backups:/backup
    depends_on:
      - db_prod

volumes:
  db_data:
  vendor_data:
