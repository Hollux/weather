server {
    listen 80;
    server_name localhost;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;
    client_max_body_size 100M;

    # ✅ RATE LIMIT API (sauf tes IPs + cron)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/m;  # 3 req/minute

    # ✅ WHITELIST Cron + IPs dev
    set $whitelist_cron 0;
    set $whitelist_dev  0;

    # Cron serveur (toutes les 5min → exempt)
    if ($request_uri ~ "^/saveminutly") {
        set $whitelist_cron 1;
    }
    
    # IPs dev localhost/front (tes sites CORS)
    if ($remote_addr ~ "^(172\.|10\.|192\.168\.|127\.)") {
        set $whitelist_dev 1;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ✅ API : Rate limit + whitelist
    location ~ ^/api {
        # Exempt whitelist
        limit_req zone=api_limit burst=200 nodelay skip=1 if=$whitelist_cron if=$whitelist_dev;
        
        # Route cron exemptée
        if ($request_uri ~ "^/saveminutly") {
            limit_req off;
        }
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
    }

    # PHP
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
    }

    # Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
