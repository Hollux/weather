# ✅ WHITELIST : Cron + localhost IPs
map $request_uri $whitelist_cron {
    ~^/saveminutly 1;
    default 0;
}

map $remote_addr $whitelist_ip {
    ~^(172\.|10\.|192\.168\.|127\.|ton-ip-front) 1;  # Ajoute ton IP front
    default 0;
}

# Clé vide = requête non comptabilisée par limit_req (skip whitelist)
map "$whitelist_cron:$whitelist_ip" $limit_key {
    default $binary_remote_addr;
    "~1"    "";
}

# RATE LIMIT 3 req/minute
limit_req_zone $limit_key zone=api_limit:10m rate=3r/m;

server {
    listen 80;
    server_name localhost;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;
    client_max_body_size 100M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ✅ API : Rate limit + WHITELIST CORRECTE
    location ~ ^/api {
        # $limit_key est vide pour cron/localhost -> limit_req ignore la requête
        limit_req zone=api_limit burst=20 nodelay;

        # Les routes Symfony sont déclarées sans préfixe /api (ex: /me, /crange/...) ;
        # côté front, c'est le proxy Nuxt (dev) qui retire /api avant de transmettre.
        # En prod on retire ce préfixe ici, avant le front controller unique.
        rewrite ^/api/(.*)$ /$1 break;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Front controller unique : $fastcgi_script_name vaudrait ici le chemin
        # demandé (qui n'existe pas sur disque) -> "File not found" côté php-fpm.
        # On force donc index.php, et on réécrit REQUEST_URI/DOCUMENT_URI sur le
        # chemin sans /api (fastcgi_params y met par défaut $request_uri, qui lui
        # reste toujours "/api/..." quel que soit le rewrite ci-dessus).
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_URI $uri;
        # fastcgi_params standard ne transmet pas l'en-tête Authorization par
        # défaut : sans ça, le JWT du Bearer token n'atteint jamais Symfony et
        # toute route authentifiée répond "Authentication required".
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # PHP
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
