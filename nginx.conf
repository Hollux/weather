# ✅ WHITELIST : Cron + localhost IPs
map $request_uri $whitelist_cron {
    ~^/saveminutly 1;
    default 0;
}

map $remote_addr $whitelist_ip {
    ~^(172\.|10\.|192\.168\.|127\.|ton-ip-front) 1;  # Ajoute ton IP front
    default 0;
}

# Clé vide = requête non comptabilisée par limit_req (skip whitelist)
map "$whitelist_cron:$whitelist_ip" $limit_key {
    default $binary_remote_addr;
    "~1"    "";
}

# RATE LIMIT 3 req/minute
limit_req_zone $limit_key zone=api_limit:10m rate=3r/m;

server {
    listen 80;
    server_name localhost;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;
    client_max_body_size 100M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ✅ API : Rate limit + WHITELIST CORRECTE
    location ~ ^/api {
        # $limit_key est vide pour cron/localhost -> limit_req ignore la requête
        limit_req zone=api_limit burst=20 nodelay;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # PHP
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
