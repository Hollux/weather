security:
    enable_authenticator_manager: true
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Security\AppUserProvider

    # ROLE_ADMIN hérite de ROLE_CRANGE : un admin a accès à tout ce qui est
    # réservé au rôle CRange (page "Luminosité Journalière").
    role_hierarchy:
        ROLE_ADMIN: ROLE_CRANGE

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\GoogleAuthenticator

            json_login:
                check_path: /login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            jwt: ~

            custom_authenticators:
                - App\Security\GoogleAuthenticator

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    #
    # Les routes d'auth sont ici en chemin "nu" (sans préfixe /api) : le front
    # les appelle en /api/xxx, et c'est le proxy (dev : nuxt.config.js ; prod :
    # la couche de reverse-proxy) qui retire le préfixe /api avant que la
    # requête n'atteigne Symfony — comme pour le reste de l'API météo existante.
    access_control:
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        # Administration des comptes : réservée aux admins.
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Gestion de son propre compte : réservée aux utilisateurs connectés.
        - { path: ^/me, roles: IS_AUTHENTICATED_FULLY }
        # Saisie de la luminosité journalière CRange : réservée à ROLE_CRANGE (et ROLE_ADMIN via role_hierarchy).
        - { path: ^/crange, roles: ROLE_CRANGE }
        # Le reste de l'API météo reste public, inchangé.

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
