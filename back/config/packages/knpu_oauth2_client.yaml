knpu_oauth2_client:
  clients:
    google:
      type: google
      client_id: '%env(OAUTH_GOOGLE_CLIENT_ID)%'
      client_secret: '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'
      # URL absolue (pas un nom de route) : le backend est derrière Apache qui
      # termine le TLS sans transmettre X-Forwarded-Proto, donc le générateur
      # d'URL de Symfony construirait un redirect_uri en http et Google le
      # rejetterait (il ne correspond pas à l'URI https enregistrée).
      redirect_route: '%env(OAUTH_GOOGLE_REDIRECT_URI)%'
