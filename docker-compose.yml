services:
  front:
    container_name: ${PROJECT_NAME}_dev_front
    build:
      context: ./front
      dockerfile: Dockerfile
    environment:
      - NODE_OPTIONS=--openssl-legacy-provider
      - URL_BACK=${URL_BACK}
    ports:
      - "${FRONT_PORT}:3000"
    volumes:
      - ./front:/app/front
      - /app/front/node_modules

  back:
    container_name: ${PROJECT_NAME}_dev_back
    build:
      context: ./back
      dockerfile: Dockerfile
    volumes:
      - ./datas:/app/datas
      - ./back:/var/www/html
      - ./back/vendor:/var/www/html/vendor      # ← vendors visibles côté Mac
    ports:
      - "${BACK_PORT}:8000"
    restart: always
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      weatherApiKey: ${weatherApiKey}
      weatherApiFreeVersion: ${weatherApiFreeVersion}
      savKey: ${savKey}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI}
    depends_on:
      - db
      - php-fpm

  cron:
    container_name: ${PROJECT_NAME}_dev_cron
    build:
      context: ./back
      dockerfile: Dockerfile
    init: true
    command: ["/usr/local/bin/supercronic", "/var/www/html/crontab"]
    volumes:
      - ./datas:/app/datas
      - ./back:/var/www/html
      - ./back/vendor:/var/www/html/vendor
    restart: always
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      weatherApiKey: ${weatherApiKey}
      weatherApiFreeVersion: ${weatherApiFreeVersion}
    depends_on:
      - db

  php-fpm:
    container_name: ${PROJECT_NAME}_dev_phpfpm
    build:
      context: ./php-fpm
    volumes:
      - ./back:/var/www/html
      - ./back/vendor:/var/www/html/vendor      # ← même vendors que le back
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      weatherApiKey: ${weatherApiKey}
      weatherApiFreeVersion: ${weatherApiFreeVersion}
      savKey: ${savKey}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI}
    depends_on:
      - db

  db:
    container_name: ${PROJECT_NAME}_dev_db
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    container_name: ${PROJECT_NAME}_dev_phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - db

  nginx:
    container_name: ${PROJECT_NAME}_dev_nginx
    image: nginx:latest
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./back:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    
  backup:
    container_name: ${PROJECT_NAME}_dev_backup
    image: fradelg/mysql-cron-backup
    restart: always
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASS=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DATABASE}
      - CRON_TIME=0 20 * * *       # Sauvegarde tous les jours à 03h00
      - MAX_BACKUPS=7             # Conserve les 7 derniers backups
      - GZIP_LEVEL=6
    volumes:
      - ./backups:/backup
    depends_on:
      - db

volumes:
  db_data:
